<svg viewBox="0 0 1200 464" width="1200" height="464" role="img" aria-label="LIGNOVA pipeline: data curation, preparation, docking, grading and release" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect x="0" y="0" width="1200" height="464" fill="#FFFFFF"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5A6670"/>
    </marker>
  </defs>

  <!-- ===== STAGE BANDS ===== -->
  <rect x="44"  y="8" width="334" height="30" rx="3" fill="#E4E7EA"/>
  <rect x="398" y="8" width="202" height="30" rx="3" fill="#E4E7EA"/>
  <rect x="620" y="8" width="175" height="30" rx="3" fill="#E4E7EA"/>
  <rect x="813" y="8" width="371" height="30" rx="3" fill="#E4E7EA"/>

  <text x="56"  y="31" font-size="20" font-weight="700" fill="#2A3338">A</text>
  <text x="225" y="30" font-size="16" font-weight="700" fill="#2A3338" text-anchor="middle" letter-spacing="1">DATA CURATION</text>
  <text x="410" y="31" font-size="20" font-weight="700" fill="#2A3338">B</text>
  <text x="513" y="30" font-size="16" font-weight="700" fill="#2A3338" text-anchor="middle" letter-spacing="1">PREPARATION</text>
  <text x="632" y="31" font-size="20" font-weight="700" fill="#2A3338">C</text>
  <text x="721" y="30" font-size="16" font-weight="700" fill="#2A3338" text-anchor="middle" letter-spacing="1">DOCKING</text>
  <text x="825" y="31" font-size="20" font-weight="700" fill="#2A3338">D</text>
  <text x="1012" y="30" font-size="16" font-weight="700" fill="#2A3338" text-anchor="middle" letter-spacing="1">GRADING &amp; RELEASE</text>

  <!-- ===== LANE LABELS ===== -->
  <text x="26" y="121" font-size="15" font-weight="700" fill="#15375C" text-anchor="middle" transform="rotate(-90 26 121)">RECEPTOR</text>
  <text x="26" y="269" font-size="15" font-weight="700" fill="#2C5A4C" text-anchor="middle" transform="rotate(-90 26 269)">LIGAND</text>
  <text x="26" y="400" font-size="15" font-weight="700" fill="#5A4468" text-anchor="middle" transform="rotate(-90 26 400)">ACTIVITY</text>

  <!-- ===== SOURCE BADGES ===== -->
  <rect x="44" y="100" width="116" height="42" rx="3" fill="#FFFFFF" stroke="#15375C" stroke-width="2"/>
  <text x="102" y="127" font-size="17" font-weight="700" fill="#15375C" text-anchor="middle">RCSB PDB</text>

  <rect x="44" y="248" width="116" height="42" rx="3" fill="#FFFFFF" stroke="#3F7D6A" stroke-width="2"/>
  <text x="102" y="275" font-size="17" font-weight="700" fill="#2C5A4C" text-anchor="middle">PubChem</text>

  <!-- ===== LANE 1 :: RECEPTOR ===== -->
  <rect x="178" y="56" width="200" height="130" rx="5" fill="none" stroke="#15375C" stroke-width="2"/>
  <text x="278" y="80" font-size="17" font-weight="700" fill="#15375C" text-anchor="middle">Structure QC</text>
  <text x="278" y="104" font-size="13" fill="#2E4A66" text-anchor="middle">X-ray &#183; &#8804; 3.0 &#197;</text>
  <text x="278" y="122" font-size="13" fill="#2E4A66" text-anchor="middle">no mutations</text>
  <text x="278" y="140" font-size="13" fill="#2E4A66" text-anchor="middle">no covalent ligands</text>
  <text x="278" y="158" font-size="13" fill="#2E4A66" text-anchor="middle">relevant co-crystal ligand</text>
  <text x="278" y="180" font-size="14" font-weight="700" fill="#15375C" text-anchor="middle">&#8776; 13 000 structures</text>

  <rect x="398" y="56" width="202" height="130" rx="5" fill="none" stroke="#15375C" stroke-width="2"/>
  <text x="499" y="104" font-size="18" font-weight="700" fill="#15375C" text-anchor="middle">PDB2PQR</text>
  <text x="499" y="130" font-size="13" fill="#2E4A66" text-anchor="middle">H atoms + H-bond network</text>
  <text x="499" y="150" font-size="13" fill="#2E4A66" text-anchor="middle">titration states via PROPKA</text>
  <text x="499" y="170" font-size="13" fill="#2E4A66" text-anchor="middle">pH 7.0</text>

  <!-- ===== LANE 2 :: LIGAND ===== -->
  <rect x="178" y="204" width="200" height="130" rx="5" fill="none" stroke="#3F7D6A" stroke-width="2"/>
  <text x="278" y="228" font-size="17" font-weight="700" fill="#2C5A4C" text-anchor="middle">Ligand QC</text>
  <text x="278" y="252" font-size="13" fill="#2C5A4C" text-anchor="middle">single defined target</text>
  <text x="278" y="270" font-size="13" fill="#2C5A4C" text-anchor="middle">
    IC<tspan baseline-shift="sub" font-size="0.75em">50</tspan>, 
    K<tspan baseline-shift="sub" font-size="0.75em">i</tspan>, 
    K<tspan baseline-shift="sub" font-size="0.75em">d</tspan>, 
    EC<tspan baseline-shift="sub" font-size="0.75em">50</tspan> only
  </text>
  <text x="278" y="288" font-size="13" fill="#2C5A4C" text-anchor="middle">actives only</text>
  <text x="278" y="316" font-size="14" font-weight="700" fill="#2C5A4C" text-anchor="middle">&#8776; 250 000 ligands</text>

  <rect x="398" y="204" width="202" height="130" rx="5" fill="none" stroke="#3F7D6A" stroke-width="2"/>
  <text x="499" y="250" font-size="18" font-weight="700" fill="#2C5A4C" text-anchor="middle">Gypsum-DL</text>
  <text x="499" y="276" font-size="13" fill="#2C5A4C" text-anchor="middle">tautomers, stereoisomers</text>
  <text x="499" y="294" font-size="13" fill="#2C5A4C" text-anchor="middle">3D conformers</text>
  <text x="499" y="312" font-size="13" fill="#2C5A4C" text-anchor="middle">pH 6.4 &#8211; 8.4</text>

  <!-- ===== LANE 3 :: ACTIVITY ===== -->
  <rect x="178" y="352" width="200" height="96" rx="5" fill="none" stroke="#9B7BAE" stroke-width="2"/>
  <text x="278" y="374" font-size="16" font-weight="700" fill="#5A4468" text-anchor="middle">Standardisation</text>
  <text x="278" y="400" font-size="15" font-weight="700" fill="#5A4468" text-anchor="middle">pActivity = &#8722;log&#8321;&#8320;[M]</text>
  <text x="278" y="420" font-size="12" fill="#5A4468" text-anchor="middle">measured activity in molar</text>
  <text x="278" y="436" font-size="12" font-style="italic" fill="#5A4468" text-anchor="middle">equivalent to pChEMBL</text>

  <rect x="398" y="352" width="202" height="96" rx="5" fill="none" stroke="#9B7BAE" stroke-width="2"/>
  <text x="499" y="384" font-size="15" font-weight="700" fill="#5A4468" text-anchor="middle">Similarity calculation</text>
  <text x="499" y="408" font-size="13" fill="#5A4468" text-anchor="middle">ECFP4 / Morgan r = 2</text>
  <text x="499" y="426" font-size="13" fill="#5A4468" text-anchor="middle">pairwise Tanimoto (T)</text>

  <!-- ===== DOCKING ===== -->
  <rect x="620" y="56" width="175" height="278" rx="5" fill="none" stroke="#1A1A1F" stroke-width="3.2"/>
  <text x="707" y="160" font-size="19" font-weight="700" fill="#1A1A1F" text-anchor="middle">GNINA 1.3</text>
  <text x="707" y="190" font-size="13" fill="#1A1A1F" text-anchor="middle">Vina + CNN scoring</text>
  <text x="707" y="208" font-size="13" fill="#1A1A1F" text-anchor="middle">autobox binding site</text>
  <text x="707" y="226" font-size="13" fill="#1A1A1F" text-anchor="middle">from co-crystal ligand</text>

  <rect x="620" y="352" width="175" height="96" rx="5" fill="none" stroke="#9B7BAE" stroke-width="2"/>
  <text x="707" y="380" font-size="17" font-weight="700" fill="#5A4468" text-anchor="middle">Cliff detection</text>
  <text x="707" y="404" font-size="12" fill="#5A4468" text-anchor="middle">T &#8805; 0.55 &#183; &#916;pActivity &#8805; 2</text>
  <text x="707" y="420" font-size="12" fill="#5A4468" text-anchor="middle">= 100-fold difference</text>
  <text x="707" y="438" font-size="12" fill="#5A4468" text-anchor="middle">severity labels</text>

  <!-- ===== GRADING ===== -->
  <rect x="813" y="56" width="137" height="278" rx="5" fill="none" stroke="#6E6E78" stroke-width="2"/>
  <text x="881" y="96" font-size="16" font-weight="700" fill="#2A2630" text-anchor="middle">Quality tiers</text>
  <text x="881" y="122" font-size="13" fill="#43404A" text-anchor="middle">two axes:</text>
  <text x="881" y="142" font-size="14" font-weight="700" fill="#43404A" text-anchor="middle">pose &#215; affinity</text>

  <line x1="828" y1="164" x2="935" y2="164" stroke="#B8B4BE" stroke-width="1.5"/>

  <rect x="826" y="212" width="26" height="15" rx="2" fill="#D9A93E" stroke="#D9A93E" stroke-width="1"/>
  <text x="858" y="224" font-size="13" fill="#2A2630">Gold</text>
  <rect x="826" y="242" width="26" height="15" rx="2" fill="#7D8B99" stroke="#7D8B99" stroke-width="1"/>
  <text x="858" y="254" font-size="13" fill="#2A2630">Silver</text>
  <rect x="826" y="272" width="26" height="15" rx="2" fill="#99582F" stroke="#99582F" stroke-width="1"/>
  <text x="858" y="284" font-size="13" fill="#2A2630">Bronze</text>
  <rect x="826" y="302" width="26" height="15" rx="2" fill="#D2D2D7" stroke="#D2D2D7" stroke-width="1"/>
  <text x="858" y="314" font-size="13" fill="#2A2630">Unranked</text>

  <!-- ===== RELEASE ===== -->
  <rect x="968" y="56" width="216" height="320" rx="5" fill="none" stroke="#6E6E78" stroke-width="2.5"/>
  <text x="1076" y="136" font-size="17" font-weight="700" fill="#2A2630" text-anchor="middle">LIGNOVA Dataset</text>
  <text x="1076" y="168" font-size="21" font-weight="700" fill="#2A2630" text-anchor="middle">(LnD)</text>

  <line x1="993" y1="192" x2="1159" y2="192" stroke="#B8B4BE" stroke-width="1.5"/>

  <text x="1076" y="220" font-size="15" font-weight="700" fill="#2A2630" text-anchor="middle">Parquet files</text>
  <text x="1076" y="246" font-size="13" fill="#2A2630" text-anchor="middle">all metadata + scores</text>
  <text x="1076" y="270" font-size="13" fill="#2A2630" text-anchor="middle">activity-cliff pairs</text>
  <text x="1076" y="294" font-size="13" fill="#2A2630" text-anchor="middle">pose tier &#183; affinity tier</text>
  <text x="1076" y="318" font-size="13" font-weight="700" fill="#2A2630" text-anchor="middle">overall complex tier</text>
  <text x="1076" y="338" font-size="13" fill="#2A2630" text-anchor="middle">= min(both)</text>

  <!-- ===== ARROWS ===== -->
  <line x1="160" y1="121" x2="178" y2="121" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <line x1="378" y1="121" x2="398" y2="121" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="121" x2="620" y2="121" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>

  <polyline points="102,248 102,170 178,170" fill="none" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <text x="140" y="164" font-size="12" font-style="italic" fill="#5A6670" text-anchor="middle">sets targets</text>

  <line x1="160" y1="269" x2="178" y2="269" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <line x1="378" y1="269" x2="398" y2="269" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="269" x2="620" y2="269" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>

  <polyline points="102,290 102,400 178,400" fill="none" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <line x1="378" y1="400" x2="398" y2="400" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="400" x2="620" y2="400" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>

  <line x1="795" y1="195" x2="813" y2="195" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <line x1="950" y1="195" x2="968" y2="195" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="795,400 1076,400 1076,376" fill="none" stroke="#5A6670" stroke-width="2" marker-end="url(#a)"/>

</svg>
