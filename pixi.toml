[workspace]
name = "lignova"
version = "0.0.0"
description = "Lignova is a flexible, physics‑driven package for rapid generation of high‑quality protein–ligand complexes."
authors = [
    "durrantlab <durrantj@pitt.edu>",
]
license = "Apache-2.0"
readme = "README.md"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[feature.mgltools.dependencies]
mgltools = ">=1.5.7,<2"

[environments]
dev = ["dev"]
docs = ["docs"]
mgltools = { features = ["mgltools"], no-default-feature = true }
publish = { features = ["publish"], no-default-feature = true }
gnina = { features = ["gnina"], no-default-feature = true }

[feature.gnina.dependencies]
openbabel = { version = ">=3,<4", channel = "conda-forge" }
python = "*"
pytest = "*"
rdkit = "*"
numpy = "*"

[feature.gnina.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$CONDA_PREFIX/targets/x86_64-linux/lib/stubs"

[feature.gnina.target.linux-64.dependencies]
sysroot_linux-64 = "2.34.*"
cuda-runtime = ">=12.8,<12.9"
cuda-version = ">=12.8,<12.9"
cuda-cudart-dev = ">=12.8,<12.9"
cuda-nvcc = ">=12.8,<12.9"
cuda-libraries-dev = { version = ">=12.8.1,<13", channel = "conda-forge" }
cuda-nvtx-dev = { version = ">=12.8.90,<13", channel = "conda-forge" }
cuda-cccl = { version = ">=12.8.90,<13", channel = "conda-forge" }
libcublas-dev = { version = ">=12.8.3.14,<13", channel = "conda-forge" }
cmake = ">=4.3.0,<5"
libprotobuf = "*"
protobuf = "*"
setuptools = "*"
gxx = { version = "*", channel = "conda-forge" }
gcc = { version = "*", channel = "conda-forge" }
libboost-devel = "*"
boost = { version = "*", channel = "conda-forge" }
eigen = { version = "*", channel = "conda-forge" }
openblas = { version = "*", channel = "conda-forge" }
jsoncpp = { version = "*", channel = "conda-forge" }

[pypi-dependencies]
lignova = { path = ".", editable = true }
gypsum-dl = ">=1.3.0, <2"
pdb2pqr = ">=3.7.1, <4"

[tasks]
setup-gnina = { cmd = ["bash", "./run_scripts/setup_gnina.sh"] }

[dependencies]
python = ">=3.12.13,<3.15"
h5py = ">=3.15.1,<4"
numpy = ">=2.4.2,<3"
rdkit = ">=2025.9.5,<2026"
loguru = ">=0.7.3,<0.8"
mdanalysis = ">=2.10.0,<3"
pandas = ">=3.0.1,<4"
scipy = ">=1.17.1,<2"
spyrmsd = ">=0.9.0,<0.10"
gemmi = ">=0.7.5,<0.8"
fasteners = ">=0.19,<0.20"
mmseqs2 = ">=18.8cc5c,<19"
pyarrow = ">=21.0.0,<22"
posebusters = ">=0.6.5,<0.7"
typing-extensions = ">=4.15.0,<5"
pyyaml = ">=6.0.3,<7"
openbabel = ">=3.1.1,<4"

[feature.dev.dependencies]
ruff = ">=0.7.3,<0.8"
mypy = ">=1.13.0,<2"
pip = ">=24.3.1,<25"
bump-my-version = ">=0.28.1,<0.29"
pytest = ">=8.3.3,<9"
pytest-cov = ">=6.0.0,<7"
coverage = ">=7.6.4,<8"
types-requests = ">=2.32.0.20241016,<3"

[feature.dev.tasks]
format = { cmd = ["ruff", "check", "--select", "I", "--fix", "--config", ".ruff.toml", "&&", "ruff", "format", "--config", ".ruff.toml", "./"] }
tests = { cmd = [
    "PYTHONPATH=.",
    "pytest",
    "-c",
    ".pytest.ini",
    "--cov='lignova'",
    "--cov-report=xml",
    "--junit-xml=report.xml",
    "--failed-first",
]}
coverage = { cmd = ["coverage", "report"] }
cleanup-build = { cmd = ["rm", "-rf", "./build"] }
build = { cmd = ["python3", "-m", "build"], depends-on = ["cleanup-build"]}
[feature.docs.dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.5.44,<10"
pymdown-extensions = ">=10.12,<11"
mkdocs-table-reader-plugin = ">=3.1.0,<4"
mkdocstrings = ">=0.26.2,<0.27"
mkdocstrings-python = ">=1.12.2,<2"
mkdocs-gen-files = ">=0.4.0,<0.5"
mkdocs-macros-plugin = ">=1.3.7,<2"
mkdocs-jupyter = ">=0.25.0,<0.26"
mkdocs-glightbox = ">=0.4.0,<0.5"
mkdocs-git-revision-date-localized-plugin = ">=1.2.9,<2"
[feature.docs.pypi-dependencies]
material-plausible-plugin = ">=0.2.0,<0.3"
mkdocs-print-site-plugin = ">=2.6.0,<3"
mkdocs-awesome-nav = ">=3.0.0, <4"
[feature.docs.tasks]
docs = { cmd = ["rm", "-rf", "./public/", "&&", "mkdocs", "build", "-d", "public/"] }
serve = { cmd = ["mkdocs", "serve"] }
[feature.publish.dependencies]
python = ">=3.11,<3.13"
twine = ">=5.1.1,<6"
[feature.publish.tasks]
publish-test = { cmd = ["twine", "upload", "--repository", "testpypi", "dist/*"] }
publish = { cmd = ["twine", "upload", "dist/*"] }