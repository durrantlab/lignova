[project]
name = "lignova"
version = "0.0.0"
description = "TODO"
authors = [
    {name = "Durrant Lab", email = "durrantj@pitt.edu"},
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "h5py>=3.15.1,<4",
    "numpy>=2.4.2,<3",
    "rdkit>=2025.9.5,<2026",
    "loguru>=0.7.3,<0.8",
    "mdanalysis>=2.10.0,<3",
    "pandas>=3.0.1,<4",
    "scipy>=1.17.1,<2",
    "spyrmsd>=0.9.0,<0.10",
    "gemmi>=0.7.5,<0.8",
    "fasteners>=0.19,<0.20",
]

[build-system]
requires = ["setuptools"]

[tool.setuptools.packages.find]
where = ["lignova"]
