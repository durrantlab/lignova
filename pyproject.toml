[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lignova"
description = "LIGNOVA: An automated pipeline to generate high-quality docked protein–ligand complexes at scale"
authors = [
    {name = "Mayar Ahmed", email = "mma121@pitt.edu"},
    {name = "Alex M. Maldonado", email = "alex.maldonado@pitt.edu"},
    {name = "Jacob D. Durrant", email = "durrantj@pitt.edu"},
]
maintainers = [
    {name = "Durrant Lab", email = "durrantj@pitt.edu"},
]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE", "THIRD_PARTY_LICENSES.md", "AUTHORS"]
keywords = ["docking", "protein-ligand", "gnina", "cheminformatics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
    "h5py>=3.15.1,<4",
    "numpy>=2.4.2,<3",
    "rdkit>=2025.9.5,<2026",
    "loguru>=0.7.3,<0.8",
    "mdanalysis>=2.10.0,<3",
    "pandas>=3.0.1,<4",
    "scipy>=1.17.1,<2",
    "spyrmsd>=0.9.0,<0.10",
    "gemmi>=0.7.5,<0.8",
    "fasteners>=0.19,<0.20",
]

[project.urls]
Repository = "https://github.com/durrantlab/lignova"
Issues = "https://github.com/durrantlab/lignova/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lignova*"]


[tool.setuptools_scm]
version_file = "lignova/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-timestamp"

[tool.basedpyright]
typeCheckingMode = "standard"
